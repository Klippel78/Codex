          - generic [ref=e290]:
            - heading "Sida 1. Huvudmeny och fasta knappar" [level=3] [ref=e291]
            - img "Huvudmeny med flikar, språk, marknad och fasta knappar" [ref=e292]
            - list [ref=e293]:
              - listitem [ref=e294]:
                - strong [ref=e295]: "Spara, Ladda sparad kalkyl och Skriv ut:"
                - text: sparar kalkylen som fil, läser in sparade CSV/JSON-kalkyler och skriver ut Sammanfattning med Win/win som sista A4-sida.
              - listitem [ref=e296]:
                - strong [ref=e297]: "Flikar:"
                - text: "använd dem från vänster till höger: Indata, Resultat, Sammanfattning, Win/win och Beräkning. Beräkning ligger längst till höger som underlagsvy."
              - listitem [ref=e298]:
                - strong [ref=e299]: "Språkval:"
                - text: välj SE, NO, DE eller EN för gränssnitt, hjälptext, rapporttext och belastningstabell.
              - listitem [ref=e300]:
                - strong [ref=e301]: "Snabbval:"
                - text: de flytande knapparna följer med vid scroll och speglar Visa i resultat, prisvisning, tillbehör och belastningstabell. Håll muspekaren över en symbol för förklaring.
              - listitem [ref=e302]:
                - strong [ref=e303]: "Marknad:"
                - text: väljer valuta och förvalda marknadsantaganden.
              - listitem [ref=e304]:
                - strong [ref=e305]: "Import:"
                - text: används för att läsa in offert och/eller ljusberäkning.
              - listitem [ref=e306]:
                - strong [ref=e307]: "Projektdata och kalkylförutsättningar:"
                - text: grundvärden som används i hela kalkylen.
          - generic [ref=e308]:
            - heading "Sida 2. Import och gemensamma inställningar" [level=3] [ref=e309]
            - img "Importpanel och huvudknappar" [ref=e310]
            - list [ref=e311]:
              - listitem [ref=e312]:
                - strong [ref=e313]: "Importera underlag:"
                - text: välj offert och/eller DIALux som PDF. Det går att importera en fil i taget, komplettera senare eller importera båda samtidigt.
              - listitem [ref=e314]:
                - strong [ref=e315]: "Existerande installation utförd år:"
                - text: väljer teknik för existerande installation och skapar standardeffekter som avrundas till vanliga heltalsvärden.
              - listitem [ref=e316]:
                - strong [ref=e317]: "Antal armaturer hämtas från:"
                - text: välj om antal ska tas från offert eller DIALux när båda underlagen finns.
              - listitem [ref=e318]:
                - strong [ref=e319]: "Visa i resultat:"
                - text: styr om Båda, Existerande eller Ny visas och påverkar Indata, Resultat, Sammanfattning och Win/win.
              - listitem [ref=e320]:
                - strong [ref=e321]: "Hämta aktuell eltariff:"
                - text: hämtar aktuell elprisdata när hjälptjänsten körs.
              - listitem [ref=e322]:
                - strong [ref=e323]: "Återställ förval:"
                - text: återställer marknadens standardvärden.
              - listitem [ref=e324]:
                - strong [ref=e325]: "Dölj armaturpriser:"
                - text: döljer armaturpriser och tar bort armaturkostnaden ur beräkning, sammanfattning och diagram.
              - listitem [ref=e326]:
                - strong [ref=e327]: "Exkludera tillbehör:"
                - text: tar bort tillbehör från ny och existerande installation samt från alla beräkningar och rapportvyer.
              - listitem [ref=e328]:
                - strong [ref=e329]: "Belastningstabell:"
                - text: öppnas från snabbvalsknappen med tabellsymbol och visar effektförbrukning för vanliga ljuskällor på valt språk.
          - generic [ref=e330]:
            - heading "Sida 3. Indata" [level=3] [ref=e331]
            - img "Indata med rum och armaturer" [ref=e332]
            - list [ref=e333]:
              - listitem [ref=e334]:
                - strong [ref=e335]: "Installationer sida vid sida:"
                - text: Ny installation och Existerande installation visas parallellt för enklare jämförelse.
              - listitem [ref=e336]:
                - strong [ref=e337]: "Ta med i jämförelse och rapport:"
                - text: styr om rummet ingår i beräkning och rapport.
              - listitem [ref=e338]:
                - strong [ref=e339]: "Rumsdata:"
                - text: fyll i rumsbeteckning, byggnadstyp, rumstyp, antal rum och yta.
              - listitem [ref=e340]:
                - strong [ref=e341]: "Speglade poster:"
                - text: + Lägg till rumstyp och + Armatur kan skapa motsvarande post i den andra installationen. Vid borttagning visas en kontroll nära klicket.
              - listitem [ref=e342]:
                - strong [ref=e343]: "Littera:"
                - text: anges separat från armaturtyp på en egen rad och används för sortering, matchning mellan underlag och koppling mellan ny och existerande installation.
              - listitem [ref=e344]:
                - strong [ref=e345]: "Armaturtyp:"
                - text: visar artikelnummer i fet text följt av armaturens namn på en rad där det får plats.
              - listitem [ref=e346]:
                - strong [ref=e347]: "Montage och demontage:"
                - text: ny installation använder montage och montering. Existerande installation använder demontage och demontering. Montageförval kan sätta kostnad automatiskt.
              - listitem [ref=e348]:
                - strong [ref=e349]: "Effektdata:"
                - text: saknad effekt kan hämtas från PIM via artikelnummer. Om effekt saknas visas n/a i rött tills ett numeriskt värde anges.
              - listitem [ref=e350]:
                - strong [ref=e351]: "Drifttid:"
                - text: välj ett förval från ljusmallen eller ange en egen årlig drifttid.
              - listitem [ref=e352]:
                - strong [ref=e353]: "CSV och sparad kalkyl:"
                - text: när en sparad kalkyl läses in uppdateras Indata, Resultat, Sammanfattning, Win/win och Beräkning.
              - listitem [ref=e354]:
                - strong [ref=e355]: "Lägg till eller ta bort:"
                - text: använd knapparna för att justera rum och armaturer.
          - generic [ref=e356]:
            - heading "Sida 4. Resultat" [level=3] [ref=e357]
            - img "Resultatvy med antaganden, KPI och diagram" [ref=e358]
            - list [ref=e359]:
              - listitem [ref=e360]:
                - strong [ref=e361]: "Teknik- och kalkylantaganden:"
                - text: kontrollera teknikår, kalkylperiod, ränta, elpris, CO2-faktor och drifttid. Ändringar slår igenom i alla vyer.
              - listitem [ref=e362]:
                - strong [ref=e363]: "Drifttidsförval:"
                - text: välj typapplikation från ljusmallen eller behåll egen drifttid.
              - listitem [ref=e364]:
                - strong [ref=e365]: "KPI-kort:"
                - text: visar total LCC, besparing, återbetalningstid och CO2-skillnad.
              - listitem [ref=e366]:
                - strong [ref=e367]: "LCC per installation:"
                - text: jämför investerings-, energi- och underhållskostnader.
              - listitem [ref=e368]:
                - strong [ref=e369]: "Ackumulerad kostnad:"
                - text: visar kostnadsutveckling över kalkylperioden.
              - listitem [ref=e370]:
                - strong [ref=e371]: "Urval för jämförelse:"
                - text: visar om hela projektet eller valda rum ingår. Valet Båda, Existerande eller Ny styr vilka kolumner och diagram som visas.
          - generic [ref=e372]:
            - heading "Sida 5. Sammanfattning" [level=3] [ref=e373]
            - img "Sammanfattning och PDF-rapport" [ref=e374]
            - list [ref=e375]:
              - listitem [ref=e376]:
                - strong [ref=e377]: "Sammanfattning:"
                - text: visar rapporten så som den ska granskas före PDF.
              - listitem [ref=e378]:
                - strong [ref=e379]: "Skriv ut:"
                - text: öppnar webbläsarens utskriftsdialog och behåller rapportens A4-layout, bilder och färger.
              - listitem [ref=e380]:
                - strong [ref=e381]: "Projektinformation:"
                - text: visar projekt, datum och handläggare i rapporten.
              - listitem [ref=e382]:
                - strong [ref=e383]: "Resultatsektion:"
                - text: visar kundens sammanfattade LCC-resultat och följer valet Båda, Existerande eller Ny.
              - listitem [ref=e384]:
                - strong [ref=e385]: "Pris- och tillbehörsval:"
                - text: dolda armaturpriser och exkluderade tillbehör tas bort även i rapporttabeller och diagram.
              - listitem [ref=e386]:
                - strong [ref=e387]: "Win/win-sida:"
                - text: Win/win läggs som sista sida i Sammanfattningen i stående A4-format så den kan skrivas ut tillsammans med rapporten.
              - listitem [ref=e388]:
                - strong [ref=e389]: "Layoutkontroll:"
                - text: kontrollera text, bilder, tabeller och diagram innan rapporten sparas.
          - generic [ref=e390]:
            - heading "Sida 6. Win/win" [level=3] [ref=e391]
            - img "Win/win-vy med affärsnytta och klimatnytta" [ref=e392]
            - list [ref=e393]:
              - listitem [ref=e394]:
                - strong [ref=e395]: "Win/win:"
                - text: öppnar en mer sälj- och kundorienterad resultatvy.
              - listitem [ref=e396]:
                - strong [ref=e397]: "Huvudbudskap:"
                - text: sammanfattar nyttan med lägre kostnad och lägre klimatpåverkan.
              - listitem [ref=e398]:
                - strong [ref=e399]: "Nyckeltal över kalkylperioden:"
                - text: visar besparing, minskad energi och minskat klimatavtryck baserat på vald kalkylperiod.
              - listitem [ref=e400]:
                - strong [ref=e401]: "Årsbasis:"
                - text: under periodvärdena visas samma data på årsbasis.
              - listitem [ref=e402]:
                - strong [ref=e403]: "Endast Ny:"
                - text: när endast Ny visas används rubrikerna Kostnad, Energiförbrukning och Klimatavtryck.
              - listitem [ref=e404]:
                - strong [ref=e405]: "Affärsnytta:"
                - text: kort text som kan användas i kunddialogen.
              - listitem [ref=e406]:
                - strong [ref=e407]: "Projekt och värdeerbjudande:"
                - text: visar vilket projekt sidan gäller och vilken nytta som lyfts.
          - generic [ref=e408]:
            - heading "Sida 7. Beräkning" [level=3] [ref=e409]
            - list [ref=e410]:
              - listitem [ref=e411]:
                - strong [ref=e412]: "Beräkning:"
                - text: visar hur kostnader, energianvändning och LCC räknas fram för varje armatur i existerande och ny installation.
              - listitem [ref=e413]:
                - strong [ref=e414]: "Armaturunderlag:"
                - text: visar littera, armaturtyp, antal, effekt, drifttid, reduktionsfaktor, investering, energi, underhåll och LCC.
              - listitem [ref=e415]:
                - strong [ref=e416]: "Belastningstabell:"
                - text: öppnar tabell för effektförbrukning för vanliga ljuskällor. Tabellen följer valt språk.
              - listitem [ref=e417]:
                - strong [ref=e418]: "Kontrollspår:"
                - text: använd vyn för att granska vilka värden som ligger bakom Resultat, Sammanfattning och Win/win.
