        - generic [ref=e223]:
          - generic [ref=e224]:
            - heading "Sida 1. Huvudmeny och fasta knappar" [level=3] [ref=e225]
            - img "Huvudmeny med flikar, språk, marknad och fasta knappar" [ref=e226]
            - list [ref=e227]:
              - listitem [ref=e228]:
                - strong [ref=e229]: "Spara, Ladda sparad kalkyl och Skriv ut:"
                - text: sparar kalkylen som fil, läser in sparade CSV/JSON-kalkyler och skriver ut Sammanfattning med Win/win som sista A4-sida.
              - listitem [ref=e230]:
                - strong [ref=e231]: "Flikar:"
                - text: "använd dem från vänster till höger: Indata, Resultat, Sammanfattning, Win/win och Beräkning. Beräkning ligger längst till höger som underlagsvy."
              - listitem [ref=e232]:
                - strong [ref=e233]: "Språkval:"
                - text: välj SE, NO, DE eller EN för gränssnitt, hjälptext, rapporttext och belastningstabell.
              - listitem [ref=e234]:
                - strong [ref=e235]: "Snabbval:"
                - text: de flytande knapparna följer med vid scroll och speglar Visa i resultat, prisvisning, tillbehör och belastningstabell. Håll muspekaren över en symbol för förklaring.
              - listitem [ref=e236]:
                - strong [ref=e237]: "Marknad:"
                - text: väljer valuta och förvalda marknadsantaganden.
              - listitem [ref=e238]:
                - strong [ref=e239]: "Import:"
                - text: används för att läsa in offert och/eller ljusberäkning.
              - listitem [ref=e240]:
                - strong [ref=e241]: "Projektdata och kalkylförutsättningar:"
                - text: grundvärden som används i hela kalkylen.
          - generic [ref=e242]:
            - heading "Sida 2. Import och gemensamma inställningar" [level=3] [ref=e243]
            - img "Importpanel och huvudknappar" [ref=e244]
            - list [ref=e245]:
              - listitem [ref=e246]:
                - strong [ref=e247]: "Importera underlag:"
                - text: välj offert och/eller DIALux som PDF. Det går att importera en fil i taget, komplettera senare eller importera båda samtidigt.
              - listitem [ref=e248]:
                - strong [ref=e249]: "Befintlig installation utförd år:"
                - text: väljer teknik för befintlig installation och skapar standardeffekter som avrundas till vanliga heltalsvärden.
              - listitem [ref=e250]:
                - strong [ref=e251]: "Antal armaturer hämtas från:"
                - text: välj om antal ska tas från offert eller DIALux när båda underlagen finns.
              - listitem [ref=e252]:
                - strong [ref=e253]: "Visa i resultat:"
                - text: styr om Båda, Befintlig eller Ny visas och påverkar Indata, Resultat, Sammanfattning och Win/win.
              - listitem [ref=e254]:
                - strong [ref=e255]: "Hämta aktuell eltariff:"
                - text: hämtar aktuell elprisdata när hjälptjänsten körs.
              - listitem [ref=e256]:
                - strong [ref=e257]: "Återställ förval:"
                - text: återställer marknadens standardvärden.
              - listitem [ref=e258]:
                - strong [ref=e259]: "Dölj armaturpriser:"
                - text: döljer armaturpriser och tar bort armaturkostnaden ur beräkning, sammanfattning och diagram.
              - listitem [ref=e260]:
                - strong [ref=e261]: "Exkludera tillbehör:"
                - text: tar bort tillbehör från ny och befintlig installation samt från alla beräkningar och rapportvyer.
              - listitem [ref=e262]:
                - strong [ref=e263]: "Belastningstabell:"
                - text: öppnas från snabbvalsknappen med tabellsymbol och visar effektförbrukning för vanliga ljuskällor på valt språk.
          - generic [ref=e264]:
            - heading "Sida 3. Indata" [level=3] [ref=e265]
            - img "Indata med rum och armaturer" [ref=e266]
            - list [ref=e267]:
              - listitem [ref=e268]:
                - strong [ref=e269]: "Installationer sida vid sida:"
                - text: Ny installation och Befintlig installation visas parallellt för enklare jämförelse.
              - listitem [ref=e270]:
                - strong [ref=e271]: "Ta med i jämförelse och rapport:"
                - text: styr om rummet ingår i beräkning och rapport.
              - listitem [ref=e272]:
                - strong [ref=e273]: "Rumsdata:"
                - text: fyll i rumsbeteckning, byggnadstyp, rumstyp, antal rum och yta.
              - listitem [ref=e274]:
                - strong [ref=e275]: "Speglade poster:"
                - text: + Lägg till rumstyp och + Armatur kan skapa motsvarande post i den andra installationen. Vid borttagning visas en kontroll nära klicket.
              - listitem [ref=e276]:
                - strong [ref=e277]: "Littera:"
                - text: anges separat från armaturtyp på en egen rad och används för sortering, matchning mellan underlag och koppling mellan ny och befintlig installation.
              - listitem [ref=e278]:
                - strong [ref=e279]: "Armaturtyp:"
                - text: visar artikelnummer i fet text följt av armaturens namn på en rad där det får plats.
              - listitem [ref=e280]:
                - strong [ref=e281]: "Montage och demontage:"
                - text: ny installation använder montage och montering. Befintlig installation använder demontage och demontering. Montageförval kan sätta kostnad automatiskt.
              - listitem [ref=e282]:
                - strong [ref=e283]: "Effektdata:"
                - text: saknad effekt kan hämtas från PIM via artikelnummer. Om effekt saknas visas n/a i rött tills ett numeriskt värde anges.
              - listitem [ref=e284]:
                - strong [ref=e285]: "Drifttid:"
                - text: välj ett förval från ljusmallen eller ange en egen årlig drifttid.
              - listitem [ref=e286]:
                - strong [ref=e287]: "CSV och sparad kalkyl:"
                - text: när en sparad kalkyl läses in uppdateras Indata, Resultat, Sammanfattning, Win/win och Beräkning.
              - listitem [ref=e288]:
                - strong [ref=e289]: "Lägg till eller ta bort:"
                - text: använd knapparna för att justera rum och armaturer.
          - generic [ref=e290]:
            - heading "Sida 4. Resultat" [level=3] [ref=e291]
            - img "Resultatvy med antaganden, KPI och diagram" [ref=e292]
            - list [ref=e293]:
              - listitem [ref=e294]:
                - strong [ref=e295]: "Teknik- och kalkylantaganden:"
                - text: kontrollera teknikår, kalkylperiod, ränta, elpris, CO2-faktor och drifttid. Ändringar slår igenom i alla vyer.
              - listitem [ref=e296]:
                - strong [ref=e297]: "Drifttidsförval:"
                - text: välj typapplikation från ljusmallen eller behåll egen drifttid.
              - listitem [ref=e298]:
                - strong [ref=e299]: "KPI-kort:"
                - text: visar total LCC, besparing, återbetalningstid och CO2-skillnad.
              - listitem [ref=e300]:
                - strong [ref=e301]: "LCC per installation:"
                - text: jämför investerings-, energi- och underhållskostnader.
              - listitem [ref=e302]:
                - strong [ref=e303]: "Ackumulerad kostnad:"
                - text: visar kostnadsutveckling över kalkylperioden.
              - listitem [ref=e304]:
                - strong [ref=e305]: "Urval för jämförelse:"
                - text: visar om hela projektet eller valda rum ingår. Valet Båda, Befintlig eller Ny styr vilka kolumner och diagram som visas.
          - generic [ref=e306]:
            - heading "Sida 5. Sammanfattning" [level=3] [ref=e307]
            - img "Sammanfattning och PDF-rapport" [ref=e308]
            - list [ref=e309]:
              - listitem [ref=e310]:
                - strong [ref=e311]: "Sammanfattning:"
                - text: visar rapporten så som den ska granskas före PDF.
              - listitem [ref=e312]:
                - strong [ref=e313]: "Skriv ut:"
                - text: öppnar webbläsarens utskriftsdialog och behåller rapportens A4-layout, bilder och färger.
              - listitem [ref=e314]:
                - strong [ref=e315]: "Projektinformation:"
                - text: visar projekt, datum och handläggare i rapporten.
              - listitem [ref=e316]:
                - strong [ref=e317]: "Resultatsektion:"
                - text: visar kundens sammanfattade LCC-resultat och följer valet Båda, Befintlig eller Ny.
              - listitem [ref=e318]:
                - strong [ref=e319]: "Pris- och tillbehörsval:"
                - text: dolda armaturpriser och exkluderade tillbehör tas bort även i rapporttabeller och diagram.
              - listitem [ref=e320]:
                - strong [ref=e321]: "Win/win-sida:"
                - text: Win/win läggs som sista sida i Sammanfattningen i stående A4-format så den kan skrivas ut tillsammans med rapporten.
              - listitem [ref=e322]:
                - strong [ref=e323]: "Layoutkontroll:"
                - text: kontrollera text, bilder, tabeller och diagram innan rapporten sparas.
          - generic [ref=e324]:
            - heading "Sida 6. Win/win" [level=3] [ref=e325]
            - img "Win/win-vy med affärsnytta och klimatnytta" [ref=e326]
            - list [ref=e327]:
              - listitem [ref=e328]:
                - strong [ref=e329]: "Win/win:"
                - text: öppnar en mer sälj- och kundorienterad resultatvy.
              - listitem [ref=e330]:
                - strong [ref=e331]: "Huvudbudskap:"
                - text: sammanfattar nyttan med lägre kostnad och lägre klimatpåverkan.
              - listitem [ref=e332]:
                - strong [ref=e333]: "Nyckeltal över kalkylperioden:"
                - text: visar besparing, minskad energi och minskat klimatavtryck baserat på vald kalkylperiod.
              - listitem [ref=e334]:
                - strong [ref=e335]: "Årsbasis:"
                - text: under periodvärdena visas samma data på årsbasis.
              - listitem [ref=e336]:
                - strong [ref=e337]: "Endast Ny:"
                - text: när endast Ny visas används rubrikerna Kostnad, Energiförbrukning och Klimatavtryck.
              - listitem [ref=e338]:
                - strong [ref=e339]: "Affärsnytta:"
                - text: kort text som kan användas i kunddialogen.
              - listitem [ref=e340]:
                - strong [ref=e341]: "Projekt och värdeerbjudande:"
                - text: visar vilket projekt sidan gäller och vilken nytta som lyfts.
          - generic [ref=e342]:
            - heading "Sida 7. Beräkning" [level=3] [ref=e343]
            - list [ref=e344]:
              - listitem [ref=e345]:
                - strong [ref=e346]: "Beräkning:"
                - text: visar hur kostnader, energianvändning och LCC räknas fram för varje armatur i befintlig och ny installation.
              - listitem [ref=e347]:
                - strong [ref=e348]: "Armaturunderlag:"
                - text: visar littera, armaturtyp, antal, effekt, drifttid, reduktionsfaktor, investering, energi, underhåll och LCC.
              - listitem [ref=e349]:
                - strong [ref=e350]: "Belastningstabell:"
                - text: öppnar tabell för effektförbrukning för vanliga ljuskällor. Tabellen följer valt språk.
              - listitem [ref=e351]:
                - strong [ref=e352]: "Kontrollspår:"
                - text: använd vyn för att granska vilka värden som ligger bakom Resultat, Sammanfattning och Win/win.
