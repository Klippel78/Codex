<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">Oversikt over LCC-kalkylatorns huvudytor</title>
  <desc id="desc">Numrerad bild som visar huvudknappar, flikar, sprakval och marknadsval.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f4}.panel{fill:#fff;stroke:#dfe8dc;stroke-width:2}.dark{fill:#0c1f27}.green{fill:#007e48}.lime{fill:#95c11f}.soft{fill:#eef6d8}.muted{fill:#65747b}.ink{fill:#102a33}.line{stroke:#dfe8dc;stroke-width:2}.txt{font-family:Arial,sans-serif;fill:#102a33}.small{font-size:18px}.mid{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.num{fill:#0c1f27}.numText{font-family:Arial,sans-serif;fill:#fff;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.call{stroke:#0c1f27;stroke-width:3;fill:none;stroke-linecap:round}
    </style>
  </defs>
  <rect class="bg" width="1180" height="640"/>
  <rect x="38" y="36" width="1104" height="92" rx="8" class="panel"/>
  <text x="72" y="78" class="txt mid">Aura Light LCC-kalkyl</text>
  <text x="72" y="106" class="txt small">Starta alltid här: språk, marknad och underlag styr resten av kalkylen.</text>
  <rect x="520" y="62" width="140" height="38" rx="5" class="panel"/><text x="590" y="87" class="txt small" text-anchor="middle">Importera</text>
  <rect x="674" y="62" width="104" height="38" rx="5" class="panel"/><text x="726" y="87" class="txt small" text-anchor="middle">Spara</text>
  <rect x="792" y="62" width="138" height="38" rx="5" class="panel"/><text x="861" y="87" class="txt small" text-anchor="middle">Ladda</text>
  <rect x="944" y="62" width="96" height="38" rx="5" class="dark"/><text x="992" y="87" fill="#fff" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Skriv ut</text>
  <circle cx="1045" cy="52" r="18" class="num"/><text x="1045" y="52" class="numText">1</text>
  <path d="M1034 63 L1008 76" class="call"/>

  <rect x="38" y="148" width="1104" height="78" rx="8" class="panel"/>
  <rect x="66" y="170" width="132" height="36" rx="0" fill="#fff" stroke="#95c11f" stroke-width="4"/><text x="132" y="194" class="txt small" text-anchor="middle">Indata</text>
  <rect x="210" y="170" width="132" height="36" rx="0" class="panel"/><text x="276" y="194" class="txt small" text-anchor="middle">Resultat</text>
  <rect x="354" y="170" width="172" height="36" rx="0" class="panel"/><text x="440" y="194" class="txt small" text-anchor="middle">Sammanfattning</text>
  <rect x="538" y="170" width="132" height="36" rx="0" class="panel"/><text x="604" y="194" class="txt small" text-anchor="middle">Win/win</text>
  <circle cx="686" cy="155" r="18" class="num"/><text x="686" y="155" class="numText">2</text>
  <path d="M673 166 L640 181" class="call"/>
  <circle cx="905" cy="188" r="21" fill="#000"/><text x="905" y="194" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">SE</text>
  <circle cx="960" cy="188" r="21" fill="#fff" stroke="#d9e1d5" stroke-width="2"/><text x="960" y="194" class="txt small" text-anchor="middle">NO</text>
  <circle cx="1015" cy="188" r="21" fill="#fff" stroke="#d9e1d5" stroke-width="2"/><text x="1015" y="194" class="txt small" text-anchor="middle">DE</text>
  <circle cx="1070" cy="188" r="21" fill="#fff" stroke="#d9e1d5" stroke-width="2"/><text x="1070" y="194" class="txt small" text-anchor="middle">EN</text>
  <circle cx="1090" cy="145" r="18" class="num"/><text x="1090" y="145" class="numText">3</text>
  <path d="M1080 158 L1067 176" class="call"/>

  <rect x="38" y="250" width="1104" height="112" rx="8" class="panel"/>
  <text x="72" y="286" class="txt label">Marknadsval</text>
  <rect x="72" y="308" width="182" height="38" rx="5" class="dark"/><text x="163" y="333" fill="#fff" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">SE Sverige (SEK)</text>
  <rect x="270" y="308" width="172" height="38" rx="5" class="panel"/><text x="356" y="333" class="txt small" text-anchor="middle">NO Norge</text>
  <rect x="458" y="308" width="210" height="38" rx="5" class="panel"/><text x="563" y="333" class="txt small" text-anchor="middle">DE Deutschland</text>
  <rect x="684" y="308" width="220" height="38" rx="5" class="panel"/><text x="794" y="333" class="txt small" text-anchor="middle">International (EUR)</text>
  <circle cx="928" cy="286" r="18" class="num"/><text x="928" y="286" class="numText">4</text>
  <path d="M911 295 L825 319" class="call"/>

  <rect x="64" y="408" width="260" height="142" rx="8" class="panel"/>
  <text x="92" y="448" class="txt label">A. Importera</text>
  <text x="92" y="482" class="txt small">Offert och ljusberäkning</text>
  <text x="92" y="514" class="muted txt small">fyller projekt och rum.</text>
  <rect x="348" y="408" width="260" height="142" rx="8" class="panel"/>
  <text x="376" y="448" class="txt label">B. Kontrollera indata</text>
  <text x="376" y="482" class="txt small">Projekt, antaganden,</text>
  <text x="376" y="514" class="muted txt small">rum och armaturer.</text>
  <rect x="632" y="408" width="260" height="142" rx="8" class="panel"/>
  <text x="660" y="448" class="txt label">C. Läs resultat</text>
  <text x="660" y="482" class="txt small">KPI, diagram, tabeller</text>
  <text x="660" y="514" class="muted txt small">och återbetalningstid.</text>
  <rect x="916" y="408" width="190" height="142" rx="8" class="panel"/>
  <text x="944" y="448" class="txt label">D. PDF</text>
  <text x="944" y="482" class="txt small">Sammanfattning</text>
  <text x="944" y="514" class="muted txt small">och Skriv ut.</text>
  <circle cx="52" cy="400" r="18" class="num"/><text x="52" y="400" class="numText">5</text>
  <path d="M66 411 L90 434" class="call"/>
</svg>
